name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun development tooling
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Show toolchain
        run: |
          node --version
          bun --version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run full verification
        run: bun run ci
